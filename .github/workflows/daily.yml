name: daily-collect

on:
  schedule:
    - cron: "30 1 * * *"   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect new models from all sources
        run: python3 scripts/collect.py

      - name: Build site
        run: python3 scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "daily-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --cached --quiet && echo "no changes" || git commit -m "daily: $(date -u +%F) collection"
          git push
