name: daily-collect

on:
  schedule:
    - cron: "30 1 * * *"   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Collect new models from all sources
        run: python3 scripts/collect.py

      - name: Assess deployment requirements
        run: python3 scripts/assess.py

      - name: Summarize with LLM
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        continue-on-error: true   # 总结失败/未配置不阻塞采集与建站
        run: |
          pip install --quiet openai
          python3 scripts/summarize.py

      - name: Build site
        run: python3 scripts/build_site.py

      # 分支策略: main 上 bot 只提交 data/(每天新文件, 天然无冲突);
      # docs/ 不入库 — 构建产物直接作为 Pages artifact 部署,
      # 需在 Settings → Pages 把 Source 切成 "GitHub Actions"
      - name: Commit data and push
        run: |
          git config user.name "daily-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "daily: $(date -u +%F) collection"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
